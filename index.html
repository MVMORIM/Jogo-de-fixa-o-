<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Correspondência · Termos de TI</title>
  <style>
    /* ----- RESET & GLOBAL ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --green: #58cc02;
      --green-dark: #46a302;
      --green-light: #89e219;
      --blue: #1cb0f6;
      --purple: #ce82ff;
      --orange: #ff9600;
      --red: #ff4b4b;
      --gold: #ffc800;
      --pink: #ff86d0;
      --bg: #131f24;
      --bg-dark: #0f191d;
      --bg-card: #1a2b32;
      --bg-hover: #223840;
      --border: #2d4750;
      --text: #f1f7fb;
      --text-dim: #8ba6b0;
      --text-mute: #5a7580;
      --r: 16px;
      --r-sm: 12px;
      --font-main: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      font-weight: 700;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }

    /* ----- APP WRAPPER ----- */
    .app {
      max-width: 640px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ----- COMPACT HEADER ----- */
    .overlay-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg-dark);
      border-bottom: 2px solid var(--border);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .overlay-bar .g-title {
      font-weight: 900;
      font-size: 15px;
      letter-spacing: -0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .overlay-bar .g-stat {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 900;
      color: var(--gold);
      flex-shrink: 0;
      background: rgba(255, 200, 0, 0.08);
      padding: 5px 12px;
      border-radius: 999px;
      border: 1.5px solid rgba(255, 200, 0, 0.3);
      white-space: nowrap;
    }

    /* ----- MAIN BODY ----- */
    .lesson-body {
      flex: 1;
      padding: 16px 12px 120px;
      width: 100%;
    }

    /* ----- CATEGORY STRIP ----- */
    .category-strip {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .gf-btn {
      flex: 0 1 auto;
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: 8px 14px;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      transition: all 0.15s;
      letter-spacing: 0.2px;
    }

    .gf-btn:hover {
      border-color: var(--blue);
      color: var(--text);
      background: var(--bg-hover);
    }

    .gf-btn.on {
      border-color: var(--green);
      color: var(--green);
      background: rgba(88, 204, 2, 0.1);
      box-shadow: 0 0 0 1px var(--green);
    }

    /* ----- CURRENT CATEGORY INFO ----- */
    .level-desc {
      margin: 0 0 12px 0;
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.5;
      font-weight: 700;
      text-align: center;
    }

    .level-desc b {
      color: var(--green);
    }

    /* ----- MODE GRID (2 columns) ----- */
    .corr-menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 0 0 16px 0;
    }

    .corr-mode {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-bottom: 4px solid var(--border);
      border-radius: var(--r-sm);
      padding: 14px 12px;
      text-align: left;
      color: var(--text);
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      min-height: 105px;
    }

    .corr-mode:hover {
      border-color: var(--green);
      background: var(--bg-hover);
      transform: translateY(-2px);
    }

    .corr-mode:active {
      transform: translateY(1px);
      border-bottom-width: 2px;
    }

    .corr-mode .cm-ico {
      font-size: 24px;
      display: block;
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .corr-mode .cm-name {
      font-size: 15px;
      font-weight: 900;
      display: block;
      letter-spacing: -0.2px;
      margin-bottom: 2px;
    }

    .corr-mode .cm-desc {
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 700;
      display: block;
      line-height: 1.3;
      margin-top: auto;
    }

    /* ----- GAME HUD (in-game stats) ----- */
    .corr-hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .corr-hud .ch-item {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 800;
      font-family: 'Courier New', monospace;
    }

    .corr-hud .ch-item.warn {
      border-color: var(--red);
      color: var(--red);
      animation: pulse 0.8s infinite;
    }

    .corr-hud .ch-item.combo {
      border-color: var(--gold);
      color: var(--gold);
    }

    /* ----- MATCHING GRID (in-game) ----- */
    .corr-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .corr-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .corr-card {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-bottom: 4px solid var(--border);
      border-radius: 12px;
      padding: 12px 10px;
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
      text-align: left;
      min-height: 60px;
      display: flex;
      align-items: center;
      line-height: 1.3;
      transition: all 0.12s;
      word-break: break-word;
      width: 100%;
    }

    .corr-card:hover:not(.done):not(.sel) {
      border-color: var(--blue);
      background: var(--bg-hover);
    }

    .corr-card.sel {
      border-color: var(--blue);
      background: rgba(28, 176, 246, 0.15);
      transform: scale(1.02);
    }

    .corr-card.done {
      opacity: 0.25;
      pointer-events: none;
      border-color: var(--green);
    }

    .corr-card.bad {
      animation: gshake 0.4s;
      border-color: var(--red);
    }

    .corr-card.flash {
      animation: flashGreen 0.5s;
    }

    /* ----- REVIEW BOX ----- */
    .corr-review {
      background: var(--bg-card);
      border: 2px solid var(--red);
      border-radius: var(--r-sm);
      padding: 14px;
      margin-bottom: 16px;
      text-align: left;
    }

    .corr-review h4 {
      font-size: 12px;
      color: var(--red);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .corr-review .rv {
      font-size: 12px;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .corr-review .rv b { color: var(--gold); }
    .corr-review .rv span { color: var(--text-dim); }

    /* ----- RESULT SCREEN ----- */
    .result {
      text-align: center;
      padding: 20px 10px;
      animation: fadeUp 0.4s ease;
    }

    .result-emoji {
      font-size: 80px;
      margin-bottom: 8px;
      display: inline-block;
      animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .result-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .result-title.win { color: var(--gold); }

    .result-sub {
      font-size: 14px;
      color: var(--text-dim);
      margin-bottom: 20px;
      font-weight: 700;
      line-height: 1.4;
    }

    .result-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 340px;
      margin: 0 auto;
    }

    /* ----- BUTTONS ----- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border-radius: var(--r-sm);
      font-size: 15px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #fff;
      border-bottom: 4px solid rgba(0, 0, 0, 0.25);
      transition: all 0.1s;
      user-select: none;
      width: 100%;
    }

    .btn:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    .btn-green { background: var(--green); }
    .btn-green:hover:not(:disabled) { background: var(--green-light); }

    .btn-outline {
      background: transparent;
      color: var(--blue);
      border: 2px solid var(--border);
      border-bottom-width: 4px;
    }
    .btn-outline:hover:not(:disabled) { background: rgba(28, 176, 246, 0.08); }
    .btn-block { width: 100%; }

    /* ----- TOAST ----- */
    .toast {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%) translateY(-140px);
      background: var(--bg-card);
      border: 2px solid var(--green);
      border-radius: var(--r-sm);
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 800;
      color: var(--green);
      z-index: 2000;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* ----- ANIMATIONS ----- */
    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pop {
      0% { transform: scale(0.6); }
      60% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    @keyframes gshake {
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    @keyframes flashGreen {
      0%, 100% { background: var(--bg-card); }
      50% { background: rgba(88, 204, 2, 0.4); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }

    /* ----- AJUSTES PARA TELAS PEQUENAS (CELULAR) ----- */
    @media (max-width: 400px) {
      .overlay-bar .g-title { font-size: 13px; }
      .overlay-bar .g-stat { font-size: 11px; padding: 4px 8px; }
      .gf-btn { padding: 6px 10px; font-size: 11px; }
      .corr-mode { padding: 12px 8px; min-height: 95px; }
      .corr-mode .cm-name { font-size: 14px; }
      .corr-mode .cm-desc { font-size: 10px; }
      .corr-card { font-size: 12px; padding: 10px 8px; min-height: 54px; }
      .result-title { font-size: 24px; }
      .result-emoji { font-size: 64px; }
      .btn { font-size: 14px; padding: 12px 16px; }
    }

    button:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }
  </style>
</head>

    const TODOS_TERMOS = Object.values(CORR_BANCO).flat();
    const CATEGORIAS = ['Todos', ...Object.keys(CORR_BANCO)];

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      if (!t) return;
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._t);
      t._t = setTimeout(() => t.classList.remove('show'), 2800);
    }

    function xpForLevel(lvl) { return Math.floor(100 * Math.pow(1.4, lvl - 1)); }
    const $g = id => document.getElementById(id);
    const G = {};
    let CAT_SEL = 'Todos';
    const KEY = 'corresp_solo_v1';
    const DEFAULT = { xp: 0, xpTotal: 0, level: 1, games: { corrRec: {}, stats: { corresp: 0 } } };
    let state = JSON.parse(JSON.stringify(DEFAULT));

    function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
    function load() {
      try {
        const r = localStorage.getItem(KEY);
        if (r) {
          const p = JSON.parse(r);
          state = { ...state, ...p };
          state.games = { ...DEFAULT.games, ...(p.games || {}) };
          state.games.stats = { ...DEFAULT.games.stats, ...state.games.stats };
        }
      } catch (e) {}
    }

    function addXp(n) {
      if (!Number.isFinite(n) || n < 0) return;
      state.xp += n; state.xpTotal += n; let up = false, g = 0;
      while (state.xp >= xpForLevel(state.level) && g++ < 1000) {
        state.xp -= xpForLevel(state.level);
        state.level++;
        up = true;
      }
      if (up) showToast('🏆 Nível ' + state.level + '!');
      save();
    }

    const CORR_MODOS = [
      { id: 'classico', ico: '🎯', name: 'Clássico', desc: '6 pares · 3 vidas' },
      { id: 'relampago', ico: '⚡', name: 'Relâmpago', desc: '10 pares · 60 segundos' },
      { id: 'sobrevivencia', ico: '💀', name: 'Sobrevivência', desc: 'Vidas = 1 · infinito' },
      { id: 'invertido', ico: '🔄', name: 'Invertido', desc: 'Definição → termo' },
      { id: 'misto', ico: '🎲', name: 'Misto', desc: 'Metade termo, metade definição' },
      { id: 'maratona', ico: '🏃', name: 'Maratona', desc: '20 pares · bônus alto' }
    ];

    function corrBanco() { return CAT_SEL === 'Todos' ? TODOS_TERMOS : (CORR_BANCO[CAT_SEL] || TODOS_TERMOS); }

    function jCorresp() {
      const banco = corrBanco();
      const rec = state.games.corrRec || (state.games.corrRec = {});
      $g('gTitle').textContent = 'Correspondência · ' + CAT_SEL;
      $g('gStat').textContent = '⭐ Nv ' + state.level + ' · ' + state.xp + '/' + xpForLevel(state.level) + ' XP';

      const catButtons = CATEGORIAS.map(c => `<button class="gf-btn${c === CAT_SEL ? ' on' : ''}" data-c="${c}">${c}</button>`).join('');
      
      const modeCards = CORR_MODOS.map(m => {
        const recVal = rec[m.id];
        return `<button class="corr-mode" data-m="${m.id}">
          <span class="cm-ico">${m.ico}</span>
          <span class="cm-name">${m.name}</span>
          <span class="cm-desc">${m.desc}${recVal ? ' · 🏆 ' + recVal : ''}</span>
        </button>`;
      }).join('');

      $g('gBody').innerHTML = `
        <div class="category-strip">${catButtons}</div>
        <p class="level-desc">Categoria: <b>${CAT_SEL}</b> (${banco.length} pares).</p>
        <div class="corr-menu">${modeCards}</div>
        <p class="level-desc">💡 Combo: acertos seguidos aumentam o XP. Errar zera o combo.</p>
        <p class="level-desc">🏅 ${state.games.stats.corresp || 0} pares acertados no total</p>
      `;

      $g('gBody').querySelectorAll('.corr-mode').forEach(b => b.onclick = () => corrIniciar(b.dataset.m));
      $g('gBody').querySelectorAll('.gf-btn').forEach(b => b.onclick = () => { CAT_SEL = b.dataset.c; jCorresp(); });
    }

    function corrIniciar(modo) {
      const banco = corrBanco();
      const cfg = {
        classico: { pares: 6, vidas: 3, tempo: 0, inv: 0, misto: 0 },
        relampago: { pares: 10, vidas: 3, tempo: 60, inv: 0, misto: 0 },
        sobrevivencia: { pares: 8, vidas: 1, tempo: 0, inv: 0, misto: 0 },
        invertido: { pares: 6, vidas: 3, tempo: 0, inv: 1, misto: 0 },
        misto: { pares: 8, vidas: 3, tempo: 0, inv: 0, misto: 1 },
        maratona: { pares: 20, vidas: 3, tempo: 0, inv: 0, misto: 0 }
      }[modo];

      const pares = shuffle(banco).slice(0, Math.min(cfg.pares, banco.length));
      let vidas = cfg.vidas, tempo = cfg.tempo, combo = 0, maxCombo = 0, ok = 0, total = pares.length, selL = null, selR = null, erros = [], travado = false;
      const startTempo = Date.now();
      const invertidos = new Set();

      if (cfg.inv) pares.forEach((_, i) => invertidos.add(i));
      if (cfg.misto) {
        const idx = shuffle(pares.map((_, i) => i)).slice(0, Math.ceil(pares.length / 2));
        idx.forEach(i => invertidos.add(i));
      }

      const L = pares.map((p, i) => ({ i, txt: invertidos.has(i) ? p[1] : p[0] }));
      const R = pares.map((p, i) => ({ i, txt: invertidos.has(i) ? p[0] : p[1] }));
      shuffle(L); shuffle(R);

      function renderHUD() {
        const comboHtml = combo >= 2 ? `<div class="ch-item combo">🔥 x${combo}</div>` : '';
        const tempoHtml = cfg.tempo ? `<div class="ch-item${tempo <= 10 ? ' warn' : ''}">⏱ ${tempo}s</div>` : '';
        $g('gStat').innerHTML = `<span class="ch-item">${ok}/${total}</span>${comboHtml}${tempoHtml}<span class="ch-item">${'❤️'.repeat(vidas)}</span>`;
      }

      function render() {
        renderHUD();
        $g('gBody').innerHTML = `
          <div class="corr-grid">
            <div class="corr-col">${L.map(c => `<button class="corr-card${c.done ? ' done' : ''}" data-lado="L" data-i="${c.i}">${escapeHtml(c.txt)}</button>`).join('')}</div>
            <div class="corr-col">${R.map(c => `<button class="corr-card${c.done ? ' done' : ''}" data-lado="R" data-i="${c.i}">${escapeHtml(c.txt)}</button>`).join('')}</div>
          </div>
          <p class="level-desc" style="margin-top:16px;text-align:center">Toque em um cartão de cada lado para ligar termo e definição.</p>
        `;
        $g('gBody').querySelectorAll('.corr-card').forEach(el => el.onclick = () => corrClick(el));
      }

      function corrClick(el) {
        if (travado || el.classList.contains('done')) return;
        const lado = el.dataset.lado;
        if (lado === 'L') {
          if (selL === el) { el.classList.remove('sel'); selL = null; return; }
          if (selL) selL.classList.remove('sel');
          selL = el; el.classList.add('sel');
        } else {
          if (selR === el) { el.classList.remove('sel'); selR = null; return; }
          if (selR) selR.classList.remove('sel');
          selR = el; el.classList.add('sel');
        }
        if (selL && selR) verificar();
      }

      function verificar() {
        const iL = +selL.dataset.i, iR = +selR.dataset.i;
        travado = true;
        if (iL === iR) {
          const l = selL, r = selR;
          l.classList.remove('sel'); r.classList.remove('sel');
          l.classList.add('done', 'flash'); r.classList.add('done', 'flash');
          selL = null; selR = null;
          combo++; maxCombo = Math.max(maxCombo, combo); ok++;
          setTimeout(() => { l.classList.remove('flash'); r.classList.remove('flash'); }, 500);
          renderHUD();
          if (ok === total) return setTimeout(() => corrFim(true), 400);
          travado = false;
        } else {
          const l = selL, r = selR;
          l.classList.add('bad'); r.classList.add('bad');
          erros.push({ termo: pares[iL][0], definicao: pares[iL][1] });
          vidas--; combo = 0;
          setTimeout(() => {
            l.classList.remove('bad', 'sel'); r.classList.remove('bad', 'sel');
            selL = null; selR = null; travado = false;
            renderHUD();
            if (vidas <= 0) corrFim(false);
          }, 600);
        }
      }

      function corrFim(venceu) {
        clearInterval(G.timer);
        const decorrido = Math.round((Date.now() - startTempo) / 1000);
        let xp = 0;
        if (venceu) {
          const base = 20 + total * 2;
          const bonusTempo = cfg.tempo ? Math.max(0, tempo * 2) : Math.max(0, (60 - decorrido));
          const bonusCombo = maxCombo >= 3 ? maxCombo * 3 : 0;
          xp = base + bonusTempo + bonusCombo;
          const r = state.games.corrRec || (state.games.corrRec = {});
          if (!r[modo] || ok > r[modo]) r[modo] = ok;
        } else {
          xp = ok * 2;
        }
        
        const stats = state.games.stats || (state.games.stats = {});
        stats.corresp = (stats.corresp || 0) + ok;
        addXp(xp); save();

        const emoji = venceu ? (modo === 'relampago' ? '⚡' : modo === 'maratona' ? '🏆' : '🎯') : '💔';
        const titulo = venceu ? 'Rodada completa!' : 'Fim de jogo';
        const sub = `${ok}/${total} pares · ${decorrido}s · combo máx x${maxCombo}${cfg.tempo ? ' · restaram ' + tempo + 's' : ''}`;
        const reviewHtml = erros.length ? `<div class="corr-review"><h4>🔴 Revise estes pares (${erros.length})</h4>${erros.map(e => `<div class="rv"><b>${escapeHtml(e.termo)}</b> = <span>${escapeHtml(e.definicao)}</span></div>`).join('')}</div>` : '';
        
        const rec = state.games.corrRec || {};
        const melhor = rec[modo] ? `🏆 Recorde neste modo: ${rec[modo]} pares` : '';

        $g('gStat').textContent = '';
        $g('gBody').innerHTML = `
          ${reviewHtml}
          <div class="result">
            <div class="result-emoji">${emoji}</div>
            <div class="result-title win">${titulo}</div>
            <div class="result-sub">${sub}${xp > 0 ? ' +' + xp + ' XP' : ''}</div>
            <div class="result-sub" style="font-size:12px; margin-bottom:24px">${melhor}</div>
            <div class="result-actions">
              <button class="btn btn-green btn-block" onclick="corrIniciar('${modo}')">JOGAR DE NOVO</button>
              <button class="btn btn-outline btn-block" onclick="jCorresp()">ESCOLHER OUTRO MODO</button>
            </div>
          </div>
        `;
      }

      if (cfg.tempo) {
        G.timer = setInterval(() => {
          tempo--; renderHUD();
          if (tempo <= 0) { clearInterval(G.timer); corrFim(false); }
        }, 1000);
      }

      render();
    }

    document.addEventListener('DOMContentLoaded', () => {
      load();
      jCorresp();
    });

    window.corrIniciar = corrIniciar;
    window.jCorresp = jCorresp;
    window.fecharJogo = jCorresp;
  </script>
</body>
</html>
